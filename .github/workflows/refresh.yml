name: Refresh NHL data and publish site

on:
  schedule:
    # Every hour from 10:00 to 00:00 Eastern (14:00–04:00 UTC), when lines move.
    - cron: "7 0-4,14-23 * * *"
  push:
    branches: [main]
    paths: ["docs/**", "scripts/**", ".github/workflows/refresh.yml"]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull latest NHL stats and odds
        run: python scripts/fetch_data.py

      - name: Save data snapshot to the repo
        run: |
          git config user.name "jofa-bets-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json
          if git diff --cached --quiet; then
            echo "No data change."
          else
            git commit -m "Data refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
